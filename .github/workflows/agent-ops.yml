name: Agent ops

# Daily grooming and the "Development status" report (no Claude usage).
# See .github/scripts/agent-ops.mjs. Never creates issues.
on:
  schedule:
    - cron: '17 6 * * 1-5' # 06:17 UTC weekdays
  workflow_dispatch:
    inputs:
      dry_run:
        description: Log actions without changing anything
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  pull-requests: write
  checks: read

concurrency:
  group: agent-ops
  cancel-in-progress: false

jobs:
  ops:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node .github/scripts/agent-ops.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
