name: Agent ops

# Hourly grooming and the "Development status" report (no Claude usage).
# See .github/scripts/agent-ops.mjs. Never creates issues.
on:
  # Immediate gate-label backstop (see agent-ops.mjs step 0).
  issues:
    types: [labeled, unlabeled, closed, reopened]
  pull_request:
    types: [labeled]
  schedule:
    - cron: '41 * * * *' # hourly, every day (dev routine runs at :07)
  workflow_dispatch:
    inputs:
      dry_run:
        description: Log actions without changing anything
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  pull-requests: write
  checks: read

# One run at a time (queued, never cancelled) so two runs can't hand out
# status:ready to different issues.
concurrency:
  group: agent-ops
  cancel-in-progress: false

jobs:
  ops:
    # Any issue change can change the queue; PR label events only matter for
    # the human-only gate labels (backstop audit).
    if: >-
      github.event_name != 'pull_request' ||
      contains(fromJSON('["approved","l3-go","human-approved-config","merge-approved"]'), github.event.label.name)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node .github/scripts/agent-ops.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
