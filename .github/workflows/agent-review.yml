name: Agent review

# Independent QA and security review of every non-draft PR, re-run on every
# new commit and PR text edit. See .github/scripts/agent-review.mjs and
# docs/agents/OPERATING-MODEL.md §5.
#
# Security: pull_request_target runs this file and the script from the default
# branch, and PR code is never checked out or executed, so a PR cannot change
# its reviewer or reach ANTHROPIC_API_KEY. The key lives in the `agent-review`
# environment, which must be restricted to the main branch.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write

concurrency:
  group: agent-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Agent review
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: agent-review
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install the Anthropic SDK (pinned)
        run: npm install --no-save --no-package-lock --ignore-scripts --prefix .github @anthropic-ai/sdk@0.130.0
      - run: node .github/scripts/agent-review.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REVIEW_MODEL: ${{ vars.REVIEW_MODEL }}
