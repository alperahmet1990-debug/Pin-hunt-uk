name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.9

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Builds lib/* (including pin-repository, which Metro and the API resolve
      # from compiled output).
      - name: Typecheck libs
        run: pnpm run typecheck:libs

      # mockup-sandbox is excluded: it has known prototype type errors that are
      # out of scope (see CLAUDE.md).
      - name: Typecheck app, API and scripts
        run: >
          pnpm -r --if-present
          --filter @workspace/pinhunt
          --filter @workspace/api-server
          --filter ./scripts
          run typecheck

      # No secrets are available here by design: the API tests point Supabase
      # at an unroutable address and the app runs in mock mode.
      - name: Tests
        run: pnpm test
