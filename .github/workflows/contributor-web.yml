# PROPOSED GitHub Actions workflow, inactive until a human copies it to
# .github/workflows/contributor-web.yml in a PR labelled `human-approved-config`
# (agents cannot edit .github/**). See docs/release/CONTRIBUTOR-WEB.md.
#
# Manual only: nothing runs on push, merge or schedule. Run it from
# GitHub → Actions → "Contributor website (manual)" → Run workflow, with
# "Use workflow from" left on main.
#
#   build  : checks out the chosen branch with no secrets, builds the real app
#            for web against the chosen EAS environment's PUBLIC settings
#            (Supabase URL, anon key, API URL), runs the credential scan and
#            uploads the site as a workflow artifact.
#   deploy : runs main's code only, in the eas-preview environment (EXPO_TOKEN,
#            branch rule main), and only uploads the built files to EAS Hosting:
#              target=preview     → alias `contributor-preview` (staging backend)
#              target=production  → production deployment, and ONLY when
#                                   confirm == "production"
name: Contributor website (manual)

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'preview = staging backend at the contributor-preview alias; production = the live site'
        type: choice
        options: [preview, production]
        default: preview
      app_ref:
        description: 'Branch to build (normally main)'
        type: string
        default: main
      confirm:
        description: 'Type "production" to deploy the live site (ignored for preview)'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: contributor-web
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main' && (inputs.target == 'preview' || inputs.confirm == 'production')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Public values only (they ship in the app anyway). No Expo token here:
    # this job runs code from app_ref.
    environment: ${{ inputs.target == 'production' && 'contributor-web-production' || 'contributor-web-preview' }}
    defaults:
      run:
        working-directory: artifacts/pinhunt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.app_ref }}
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.9

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Credential scan tests
        run: node --test scripts/lib/webLeakCheck.test.mjs

      - name: Build the website (credential scan)
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_API_BASE_URL: ${{ vars.EXPO_PUBLIC_API_BASE_URL }}
        run: node scripts/build-contributor-web.mjs --out "$GITHUB_WORKSPACE/contributor-web-dist"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: contributor-web-dist
          path: contributor-web-dist
          retention-days: 3
          if-no-files-found: error

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && (inputs.target == 'preview' || inputs.confirm == 'production')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: eas-preview
    defaults:
      run:
        working-directory: artifacts/pinhunt
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_CLI: eas-cli@24.13.0
    steps:
      # main's own code (app.json with the EAS project id); nothing from app_ref.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.9

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install (main)
        working-directory: .
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: contributor-web-dist
          # eas deploy resolves --export-dir relative to the app folder.
          path: artifacts/pinhunt/dist-contributor-web

      - name: Deploy preview (alias contributor-preview)
        if: inputs.target == 'preview'
        run: |
          npx --yes "$EAS_CLI" deploy \
            --export-dir dist-contributor-web \
            --alias contributor-preview \
            --non-interactive

      - name: Deploy production
        if: inputs.target == 'production' && inputs.confirm == 'production'
        run: |
          npx --yes "$EAS_CLI" deploy \
            --export-dir dist-contributor-web \
            --prod \
            --non-interactive
