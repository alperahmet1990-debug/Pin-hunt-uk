name: Project status sync

# Labels → Project "Status" (Kanban column). One-way: dragging a card never
# changes labels, and the next sync moves it back to the column its labels
# justify. See .github/scripts/project-sync.mjs.
#
# Security: runs only code from the default branch. pull_request_target is
# used (never pull_request) and PR code is never checked out, so a PR cannot
# alter this workflow or read PROJECT_TOKEN.
on:
  issues:
    types: [opened, closed, reopened, labeled, unlabeled]
  pull_request_target:
    types: [opened, closed, reopened, labeled, unlabeled, edited]
  schedule:
    - cron: '23 * * * *' # hourly sweep (also reverts dragged cards)
  workflow_dispatch:
    inputs:
      dry_run:
        description: Log changes without applying them
        type: boolean
        default: false

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: project-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node .github/scripts/project-sync.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          PROJECT_NUMBER: '1'
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
