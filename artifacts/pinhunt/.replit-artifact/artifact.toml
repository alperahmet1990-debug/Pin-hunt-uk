kind = "mobile"
previewPath = "/"
title = "PinHunt UK"
version = "1.0.0"
id = "artifacts/pinhunt"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 23007

[services.development]
run = "pnpm --filter @workspace/pinhunt run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pinhunt", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/pinhunt", "run", "serve" ]

[services.env]
PORT = "23007"
BASE_PATH = "/"
