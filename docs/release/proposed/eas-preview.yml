# PROPOSED GitHub Actions workflow — inactive until a human moves it to
# .github/workflows/eas-preview.yml in a PR labelled `human-approved-config`
# (agents cannot edit .github/**). See docs/release/EAS-PREVIEW.md.
#
# Manual only: nothing runs on push, merge or schedule. Run it from
# GitHub → Actions → "EAS preview (manual)" → Run workflow (works from a
# phone browser). Only runs against main, i.e. the latest approved version.
name: EAS preview (manual)

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'ota-update = push JS changes to installed preview builds; testflight-build = new iOS binary to TestFlight'
        type: choice
        options:
          - ota-update
          - testflight-build
        default: ota-update
      message:
        description: 'Update message shown in the Expo dashboard (optional)'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: eas-preview
  cancel-in-progress: false

jobs:
  eas:
    name: ${{ inputs.task }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # EXPO_TOKEN lives in this GitHub environment (not as a repo secret), with a
    # deployment-branch rule of `main`, so PR and agent workflows cannot read it.
    environment: eas-preview
    defaults:
      run:
        working-directory: artifacts/pinhunt
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_CLI: eas-cli@24.13.0
    steps:
      - name: Check for EXPO_TOKEN
        working-directory: .
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Add EXPO_TOKEN to the eas-preview GitHub environment (see docs/release/EAS-PREVIEW.md)." >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.9

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        working-directory: .
        run: pnpm install --frozen-lockfile

      # Bundles the JS on this runner with the EAS "preview" environment
      # variables and publishes it to the `preview` channel. Installed preview
      # builds pick it up the next time the app is opened, but only if their
      # runtime fingerprint matches (no native changes since that build).
      - name: Publish OTA update to preview
        if: inputs.task == 'ota-update'
        env:
          MESSAGE: ${{ inputs.message }}
        run: |
          npx --yes "$EAS_CLI" update \
            --channel preview \
            --environment preview \
            --platform ios \
            --message "${MESSAGE:-main @ ${GITHUB_SHA::7}}" \
            --non-interactive

      # Queues a cloud iOS build on EAS and submits it to TestFlight when it
      # finishes. Needs the one-time interactive first build (credentials and
      # App Store Connect app) and `ascAppId` in eas.json.
      - name: Build iOS and submit to TestFlight
        if: inputs.task == 'testflight-build'
        run: |
          npx --yes "$EAS_CLI" build \
            --platform ios \
            --profile preview \
            --auto-submit \
            --non-interactive \
            --no-wait
